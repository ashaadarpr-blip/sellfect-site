<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SELLFECT | سيلفيكت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Michroma&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<style>
:root{--bg:#0d0d0d;--bg2:#171716;--ink:#ece6da;--mute:#a6a6a6;--ac:#e6d8c4;--ac2:#fff4de;--line:rgba(230,216,196,.18);--on:#14120f;--m1:#fff4de;--m2:#e6d8c4;--m3:#9c8f78;--hbg:rgba(13,13,13,.84);
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eee9df;--bg2:#e2dccd;--ink:#16140f;--mute:#5f5a4f;--ac:#5a4a2c;--ac2:#3a2f19;--line:rgba(40,30,10,.22);--on:#f6f1e4;--m1:#4a3d24;--m2:#2b2417;--m3:#15110a;--hbg:rgba(238,233,223,.88);color-scheme:light}}
:root[data-theme="dark"]{--bg:#0d0d0d;--bg2:#171716;--ink:#ece6da;--mute:#a6a6a6;--ac:#e6d8c4;--ac2:#fff4de;--line:rgba(230,216,196,.18);--on:#14120f;--m1:#fff4de;--m2:#e6d8c4;--m3:#9c8f78;--hbg:rgba(13,13,13,.84);color-scheme:dark}
.hero{--ink:#ece6da;--mute:#a6a6a6;--ac:#e6d8c4;--ac2:#fff4de;--line:rgba(230,216,196,.18);--on:#14120f;--m1:#fff4de;--m2:#e6d8c4;--m3:#9c8f78}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
html::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Montserrat","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.8;font-size:1rem}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
:lang(ar){font-family:"IBM Plex Sans Arabic","Montserrat",Tahoma,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
[hidden]{display:none!important}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-inline:1.25rem}
.disp{font-family:Michroma,"Segoe UI",Arial,sans-serif;direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:1rem;padding-block:.7rem}
.brand{display:flex;align-items:center;gap:.6rem;font-size:.82rem;letter-spacing:.18em}
.brand svg{width:26px;height:26px}
nav.main{display:flex;gap:1.4rem;margin-inline-start:auto;font-size:.92rem;color:var(--mute)}
nav.main a:hover{color:var(--ac)}
.tools{display:flex;gap:.5rem;align-items:center}
.ibtn{position:relative;min-width:2.5rem;height:2.5rem;padding-inline:.7rem;border:1px solid var(--line);background:transparent;border-radius:999px;cursor:pointer;display:grid;place-items:center;font-size:.82rem;font-weight:600}
.ibtn:hover{border-color:var(--ac);color:var(--ac)}
.ibtn svg{width:18px;height:18px}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:1.25rem;height:1.25rem;border-radius:999px;background:var(--ac);color:var(--on);font-size:.72rem;font-weight:700;display:grid;place-items:center;padding-inline:.25rem}
@media (max-width:640px){nav.main{display:none}.tools{margin-inline-start:auto}}

.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(120% 90% at 85% -10%,rgba(255,244,222,.17),transparent 55%),linear-gradient(180deg,#151514,#0d0d0d);color:var(--ink)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent 36%,rgba(255,244,222,.07) 52%,transparent 68%)}
.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:4.5rem 5rem}
.lock>*{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.lock>:nth-child(2){animation-delay:.15s}.lock>:nth-child(3){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lock{display:flex;flex-direction:column;align-items:center}
.lock .mk{width:clamp(120px,30vw,200px);height:auto;filter:drop-shadow(0 16px 24px rgba(0,0,0,.6))}
.word{margin:1.6rem 0 0;font-size:clamp(1.9rem,9.2vw,4.4rem);font-weight:400;letter-spacing:.2em;padding-inline-start:.2em;line-height:1.1;background:linear-gradient(100deg,#e6d8c4 0%,#fff4de 45%,#e6d8c4 58%,#9c8f78 100%);background-size:220% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1s .15s both,sheen 2.8s ease-out .6s forwards}
@keyframes sheen{to{background-position:0 0}}
.sub-w{display:flex;align-items:center;gap:1rem;margin-top:.9rem;color:var(--mute);font-size:.72rem;letter-spacing:.7em;padding-inline-start:.7em}
.sub-w::before,.sub-w::after{content:"";width:clamp(24px,8vw,60px);height:1px;background:var(--line)}
.tag{margin:2.4rem 0 0;font-size:clamp(1.7rem,6vw,2.9rem);font-weight:600;line-height:1.4;color:var(--ac2)}
.tag2{margin:.3rem 0 0;color:var(--mute);max-width:40ch}
.be{margin-top:.8rem;font-size:.7rem;letter-spacing:.35em;color:var(--ac)}
.btn{display:inline-block;padding:.9rem 2rem;border:1px solid var(--ac);background:var(--ac);color:var(--on);font-weight:600;border-radius:2px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--ac2);border-color:var(--ac2)}
.btn.ghost{background:transparent;color:var(--ac)}
.btn.ghost:hover{background:var(--ac);color:var(--on)}
.hero .btn{margin-top:2.2rem}

section{padding-block:4.5rem;scroll-margin-top:3.5rem}
h2{font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:600;margin:0 0 1.4rem;line-height:1.4}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.8rem}
.chip{cursor:pointer;padding:.4rem 1.1rem;border:1px solid var(--line);background:transparent;border-radius:999px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.grid{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.item{display:flex;flex-direction:column}
.art{position:relative;aspect-ratio:4/5;background:#fff;border:1px solid var(--line);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.qb{position:absolute;top:.6rem;inset-inline-start:.6rem;background:var(--ac);color:var(--on);border-radius:999px;font-size:.78rem;font-weight:700;padding:.1rem .6rem}
.item h3{margin:.9rem 0 .1rem;font-size:1.05rem;font-weight:600;line-height:1.5}
.sizes{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .9rem}
.sz{min-width:2.6rem;padding:.2rem .6rem;border:1px solid var(--line);background:transparent;cursor:pointer;border-radius:2px;font-size:.85rem}
.sz[aria-pressed="true"]{border-color:var(--ac);background:var(--ac);color:var(--on)}
.buy{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.price{font-weight:600;color:var(--ac)}
.plus{display:flex;align-items:center;gap:.5rem;border:1px solid var(--ac);background:var(--ac);color:var(--on);border-radius:999px;padding:.35rem .9rem .35rem .4rem;cursor:pointer;font-weight:600;font-size:.88rem;transition:transform .12s}
.plus:active{transform:scale(.95)}
.plus i{display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--on);color:var(--ac);font-style:normal;font-size:1.25rem;line-height:1;padding-bottom:.1rem}

.vals{background:var(--bg2);border-block:1px solid var(--line)}
.facts{display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.facts div{border-inline-start:2px solid var(--ac);padding-inline-start:1rem}
.facts h3{margin:0 0 .3rem;font-size:1.05rem;color:var(--ac);font-weight:600}
.facts p{margin:0;color:var(--mute);font-size:.94rem}
.help{text-align:center}
.help p{color:var(--mute);max-width:46ch;margin:0 auto 1.6rem}
.help .row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding-block:1.8rem;color:var(--mute);font-size:.86rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
footer nav{display:flex;gap:1.4rem}

.bar{position:fixed;inset-inline:0;bottom:0;z-index:55;padding:.8rem 1.25rem calc(.8rem + env(safe-area-inset-bottom,0px));background:var(--hbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar button{width:100%;max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1.2rem;background:var(--ac);color:var(--on);border:0;border-radius:2px;font-weight:600;cursor:pointer}
body.hasbar{padding-bottom:5rem}
.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:1.2rem 1.25rem calc(1.4rem + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:14px;border-bottom:1px solid var(--line)}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.sh h3{margin:0;font-size:1.2rem}
.lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lines li{display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;padding:.9rem 0;border-bottom:1px solid var(--line);align-items:center}
.lines .nm{font-weight:600}.lines .mt{color:var(--mute);font-size:.88rem}
.step{display:flex;align-items:center;gap:.5rem;grid-row:span 2}
.step button{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--ac);background:transparent;color:var(--ac);cursor:pointer;font-size:1.2rem;line-height:1}
.step button:hover{background:var(--ac);color:var(--on)}
.step b{min-width:1.4rem;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:600;margin:1.1rem 0}
.sheet .btn{width:100%;text-align:center}
.sheet .btn+.btn{margin-top:.6rem}
.f{display:block;margin-bottom:.9rem;font-size:.9rem;color:var(--mute)}
.f input,.f textarea,.f select{display:block;width:100%;margin-top:.3rem;padding:.75rem .9rem;background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;border-radius:2px}
.f textarea{min-height:4.2rem;resize:vertical}
.f select{background:var(--bg);appearance:auto}
.promo{position:relative;z-index:1;background:var(--ac);color:var(--on);text-align:center;padding:.5rem 1rem;font-size:.86rem;font-weight:600}
.brk{margin:.8rem 0 .2rem}.brk>div{display:flex;justify-content:space-between;gap:1rem;color:var(--mute);font-size:.95rem;padding:.15rem 0}.brk>div.tot{color:var(--ink);margin:.4rem 0 .8rem;padding-top:.7rem;border-top:1px solid var(--line)}
#ferr{min-height:1.4rem;color:#e08a6a;font-size:.9rem;margin-bottom:.6rem}
.ok{text-align:center}
.ok .big{width:58px;height:58px;margin:.4rem auto 1rem;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;color:var(--ac);font-size:1.8rem}
.oid{display:inline-block;margin:.2rem 0 1rem;padding:.3rem 1rem;border:1px dashed var(--ac);color:var(--ac);letter-spacing:.14em;font-weight:600}
.ok .lines{text-align:start;margin-bottom:1rem}
.toast{position:fixed;inset-inline:0;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;z-index:80;background:var(--ac);color:var(--on);padding:.5rem 1.2rem;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

.stage{position:relative;width:clamp(160px,46vw,280px);aspect-ratio:1;perspective:1100px;touch-action:pan-y;cursor:grab;margin-top:.4rem}
.logo3d{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.layer{position:absolute;inset:0}
.layer svg{width:100%;height:100%;display:block;overflow:visible}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.soc{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center}
.sb{width:2.7rem;height:2.7rem;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ac);transition:background .2s,color .2s,transform .2s}
.sb:hover{background:var(--ac);color:var(--on);transform:translateY(-2px)}
.sb svg{width:20px;height:20px}
button.sb{background:transparent;padding:0;cursor:pointer}
.sb.soon{opacity:.55}
footer nav{align-items:center}
.item.sold .art img{filter:grayscale(1);opacity:.45}
.plus[disabled]{opacity:.5;cursor:not-allowed}
.plus.soldbtn{padding:.35rem .9rem}.plus.soldbtn span{display:inline}
.gsh{width:min(58vw,210px);height:22px;margin-top:-.2rem;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),transparent 70%);filter:blur(7px)}
.word{filter:drop-shadow(0 1px 0 #6e6249) drop-shadow(0 2px 0 #54493a) drop-shadow(0 3px 0 #3c3429) drop-shadow(0 4px 0 #2a241c) drop-shadow(0 14px 14px rgba(0,0,0,.65))}
.hero::before{background-size:220% 100%;animation:beam 11s ease-in-out infinite alternate}
@keyframes beam{from{background-position:0 0}to{background-position:100% 0}}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.65),transparent 60%),radial-gradient(ellipse at 50% -20%,rgba(0,0,0,.5),transparent 55%)}
.hero .wrap{z-index:2}
.tick{overflow:hidden;border-bottom:1px solid var(--line);background:var(--bg2);direction:ltr}
.tk{display:flex;width:max-content;animation:tk 34s linear infinite}
.tk span{padding:.85rem 0;font-size:.68rem;letter-spacing:.38em;color:var(--ac);white-space:pre}
@keyframes tk{to{transform:translateX(-50%)}}
.ptag{position:absolute;bottom:.6rem;inset-inline-end:.6rem;font-size:.5rem;letter-spacing:.28em;background:rgba(13,13,13,.8);color:#e6d8c4;padding:.3rem .6rem}
.art img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.item:hover .art img{transform:scale(1.06)}
.look{padding-bottom:4rem}
.lb{display:flex;gap:.8rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.6rem;-webkit-overflow-scrolling:touch}
.lb figure{position:relative;flex:0 0 78%;margin:0;scroll-snap-align:start;aspect-ratio:3/5;overflow:hidden;border:1px solid var(--line);background:#000}
.lb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.lb figure:hover img{transform:scale(1.05)}
.lb figcaption{position:absolute;bottom:.8rem;inset-inline-start:.9rem;font-size:.65rem;letter-spacing:.3em;color:#e6d8c4;text-shadow:0 1px 8px #000}
@media (min-width:760px){.lb{overflow:visible}.lb figure{flex:1}}
.mani{margin:0 0 2.6rem;font-size:clamp(1.7rem,6.2vw,3.3rem);font-weight:600;line-height:1.45;max-width:20ch}
.facts{counter-reset:f}.facts>div{counter-increment:f}
.facts>div::before{content:"0" counter(f);display:block;font-family:Michroma,"Segoe UI",Arial,sans-serif;direction:ltr;font-size:.68rem;letter-spacing:.25em;color:var(--mute);margin-bottom:.5rem}
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.tk,.hero::before{animation:none}.js .rv{opacity:1;transform:none;transition:none}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:1rem}.item h3{font-size:.95rem}.plus span{display:none}.plus{padding:.3rem}section{padding-block:3.2rem}}
@media (prefers-reduced-motion:reduce){.lock>*,.word,.sheet{animation:none}.word{background-position:0 0}html{scroll-behavior:auto}}
</style>
</head>

  <input type="hidden" name="form-name" value="order"><input name="bot-field">

<header>
  <div class="wrap">

<main id="top">
  <div class="hero">
    <div class="wrap">

function P(id){for(var i=0;i<PRODUCTS.length;i++){if(PRODUCTS[i].id===id)return PRODUCTS[i];}return null;}
cart=cart.filter(function(i){return i&&P(i.id)&&i.q>0&&SOLD.indexOf(i.id)<0;});
function t(k){return T[lang][k];}
function $(s){return document.querySelector(s);}
function money(n){return n.toLocaleString("en-US")+" "+CUR[lang];}
function save(){try{localStorage.setItem("sf_cart",JSON.stringify(cart));}catch(e){}}
function count(){return cart.reduce(function(a,i){return a+i.q;},0);}
function total(){return cart.reduce(function(a,i){return a+i.q*P(i.id).price;},0);}
function wa(text){return "https://wa.me/"+WA+(text?"?text="+encodeURIComponent(text):"");}
var tt;function toast(m){var e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on");},1600);}

function drawShop(){
  var c=$("#chips");c.innerHTML="";
  ["all","sets","hoodies","pants"].forEach(function(k){
    var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t(k);b.setAttribute("aria-pressed",String(cur===k));
    b.onclick=function(){cur=k;drawShop();};c.appendChild(b);
  });
  var g=$("#grid");g.innerHTML="";
  PRODUCTS.filter(function(p){return cur==="all"||p.cat===cur;}).forEach(function(p){
    if(!sel[p.id])sel[p.id]=p.sizes[1];
    var el=document.createElement("article");el.className="item rv";
    var art=document.createElement("div");art.className="art";
    var im=document.createElement("img");im.src=p.img;im.alt=p.n[lang];art.appendChild(im);
    var qb=document.createElement("span");qb.className="qb";qb.hidden=true;qb.dataset.q=p.id;art.appendChild(qb);
    var tg=document.createElement("span");tg.className="ptag disp";tg.textContent=p.tag;art.appendChild(tg);
    var h=document.createElement("h3");h.textContent=p.n[lang];
    var sz=document.createElement("div");sz.className="sizes";sz.setAttribute("role","group");sz.setAttribute("aria-label",t("size"));
    p.sizes.forEach(function(s){
      var b=document.createElement("button");b.type="button";b.className="sz";b.textContent=s;b.setAttribute("aria-pressed",String(sel[p.id]===s));
      b.onclick=function(){sel[p.id]=s;Array.prototype.forEach.call(sz.children,function(x){x.setAttribute("aria-pressed",String(x.textContent===s));});};
      sz.appendChild(b);
    });
    var buy=document.createElement("div");buy.className="buy";
    var pr=document.createElement("span");pr.className="price";pr.textContent=money(p.price);
    var pl=document.createElement("button");pl.type="button";pl.className="plus";pl.setAttribute("aria-label",t("add")+" — "+p.n[lang]);
    pl.innerHTML="<i>+</i><span>"+t("add")+"</span>";
    pl.onclick=function(){addItem(p.id,sel[p.id]);};
    if(SOLD.indexOf(p.id)>-1){pl.disabled=true;pl.className="plus soldbtn";pl.innerHTML="<span>"+t("sold")+"</span>";el.classList.add("sold");}
    buy.appendChild(pr);buy.appendChild(pl);
    el.appendChild(art);el.appendChild(h);el.appendChild(sz);el.appendChild(buy);g.appendChild(el);
  });
  updQ();reveal();
}
function updQ(){
  Array.prototype.forEach.call(document.querySelectorAll(".qb"),function(e){
    var n=cart.reduce(function(a,i){return a+(i.id===e.dataset.q?i.q:0);},0);
    e.hidden=!n;e.textContent="× "+n;
  });
}
function addItem(id,s){
  if(SOLD.indexOf(id)>-1){return;}
  var f=cart.filter(function(i){return i.id===id&&i.s===s;})[0];
  if(f){f.q=Math.min(f.q+1,20);}else{cart.push({id:id,s:s,q:1});}
  save();drawCart();toast(t("added"));
}
function lineHTML(i,k,ctl){
  var p=P(i.id),li=document.createElement("li");
  var a=document.createElement("div");
  a.innerHTML='<div class="nm"></div><div class="mt"></div>';
  a.firstChild.textContent=p.n[lang];
  a.lastChild.innerHTML=t("size")+": <bdi>"+i.s+"</bdi> · <bdi>"+money(p.price)+"</bdi>"+(ctl?"":" × <bdi>"+i.q+"</bdi>");
  li.appendChild(a);
  if(ctl){
    var s=document.createElement("div");s.className="step";
    var m=document.createElement("button");m.type="button";m.textContent="−";m.setAttribute("aria-label","−");m.onclick=function(){setQ(k,i.q-1);};
    var b=document.createElement("b");b.textContent=i.q;
    var pl=document.createElement("button");pl.type="button";pl.textContent="+";pl.setAttribute("aria-label","+");pl.onclick=function(){setQ(k,i.q+1);};
    s.appendChild(m);s.appendChild(b);s.appendChild(pl);li.appendChild(s);
  }else{
    var tp=document.createElement("div");tp.className="nm";tp.textContent=money(i.q*p.price);li.appendChild(tp);
  }
  return li;
}
function setQ(k,q){if(q<=0){cart.splice(k,1);}else{cart[k].q=Math.min(q,20);}save();drawCart();}
function drawCart(){
  var n=count(),open=!$("#ov").hidden;
  var bc=$("#bc");bc.hidden=!n;bc.textContent=n;
  var bar=$("#bar");bar.hidden=!n||open;document.body.classList.toggle("hasbar",!!n&&!open);
  $("#barl").textContent=t("view")+" · "+n+" "+t("items");$("#bart").textContent=money(total());
  var ul=$("#lines");ul.innerHTML="";
  cart.forEach(function(i,k){ul.appendChild(lineHTML(i,k,true));});
  $("#empty").hidden=!!n;$("#cartfoot").hidden=!n;ul.hidden=!n;
  $("#ctot").textContent=money(total());updForm();
  updQ();
  if(open&&!n&&!$("#v-cart").hidden){}
}
function drawGov(){
  var sel=$("#gov"),v=sel.value;
  sel.innerHTML="";var o=document.createElement("option");o.value="";o.textContent=t("pickGov");sel.appendChild(o);
  GOV.forEach(function(g){var e=document.createElement("option");e.value=g[0];e.textContent=g[lang==="ar"?1:2];sel.appendChild(e);});
  sel.value=v;
}
function updForm(){
  var sub=total(),k=$("#gov").value,sh=shipFor(k,cart),g=gov(k);
  $("#fsub").textContent=money(sub);
  $("#fshl").textContent=t("ship")+(g?" — "+g[lang==="ar"?1:2]:"");
  $("#fship").textContent=sh===null?t("shipHint"):(sh===0?t("free"):money(sh));$("#fclr").hidden=!CLEARANCE.on;
  $("#ftot").textContent=money(sub+(sh||0));
}
function view(v){
  $("#v-cart").hidden=v!=="cart";$("#v-form").hidden=v!=="form";$("#v-done").hidden=v!=="done";
  $("#stitle").textContent=v==="cart"?t("cart"):v==="form"?t("form"):t("doneT");
  $("#ov").querySelector(".sheet").scrollTop=0;
}
function openSheet(v){
  opener=document.activeElement;view(v||"cart");$("#ov").hidden=false;document.body.style.overflow="hidden";drawCart();$("#sx").focus();
}
function closeSheet(){
  $("#ov").hidden=true;document.body.style.overflow="";drawCart();
  if(opener&&opener.focus){try{opener.focus();}catch(e){}}
}

function ownerLines(){
  return cart.map(function(i,k){var p=P(i.id);return (k+1)+") "+p.n.ar+" | "+i.s+" | "+i.q+" × "+p.price+" = "+(i.q*p.price);}).join("\n");
}
function newId(){
  var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r="";
  for(var i=0;i<3;i++){r+=a.charAt(Math.floor(Math.random()*a.length));}
  return "SF-"+Date.now().toString(36).slice(-4).toUpperCase()+r;
}
$("#v-form").addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target,err=$("#ferr"),btn=$("#send");
  var d={name:f.name.value.trim(),phone:f.phone.value.replace(/[\s\-()]/g,""),city:f.city.value,address:f.address.value.trim(),notes:f.notes.value.trim()};
  if(!d.name||!d.phone||!d.city||!d.address){err.textContent=t("eReq");return;}
  if(!/^\+?\d{8,15}$/.test(d.phone)){err.textContent=t("ePhone");return;}
  if(!cart.length){return;}
  err.textContent="";btn.disabled=true;btn.textContent=t("sending");
  var id=newId(),snap=cart.map(function(i){return {id:i.id,s:i.s,q:i.q};}),sub=total(),sh=shipFor(d.city,cart),tot=sub+sh,g=gov(d.city);
  var body=new URLSearchParams({"form-name":"order","bot-field":"",order_id:id,name:d.name,phone:d.phone,city:g[1]+" ("+g[2]+")",address:d.address,notes:d.notes,items:ownerLines(),subtotal:sub+" EGP",shipping:sh+" EGP",promo:(promoOn(d.city,cart)?"clearance":""),total:tot+" EGP",lang:lang});
  fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()})
  .then(function(r){if(!r.ok){throw new Error("x");}
    lastOrder={id:id,items:snap,total:tot};cart=[];save();
    $("#oid").textContent=id;$("#wtrack").href=wa(t("trk")+id);
    var ul=$("#dlines");ul.innerHTML="";snap.forEach(function(i,k){ul.appendChild(lineHTML(i,k,false));});
    $("#dsub").textContent=money(sub);$("#dshl").textContent=t("ship")+" — "+g[lang==="ar"?1:2];$("#dship").textContent=sh===0?t("free"):money(sh);$("#dtot").textContent=money(tot);f.reset();drawCart();view("done");})
  .catch(function(){err.innerHTML="";err.textContent=t("eSend");})
  .then(function(){btn.disabled=false;btn.textContent=t("confirm");});
});

function setLang(l){
  lang=l;try{localStorage.setItem("sf_lang",l);}catch(e){}
  var h=document.documentElement;h.lang=l;h.dir=l==="ar"?"rtl":"ltr";
  document.title=l==="ar"?"SELLFECT | سيلفيكت — ستريت وير":"SELLFECT | Streetwear";
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(e){e.textContent=t(e.getAttribute("data-t"));});
  Array.prototype.forEach.call(document.querySelectorAll("[data-ta]"),function(e){e.setAttribute("aria-label",t(e.getAttribute("data-ta")));});
  $("#lng").textContent=t("lang");$("#promo").hidden=!CLEARANCE.on;if(CLEARANCE.on){$("#cnote").textContent=t("clrCart");}$("#send").textContent=t("confirm");
  $("#wa1").href=wa("");$("#wa2").href=wa("");
  if(lastOrder&&!$("#v-done").hidden){$("#wtrack").href=wa(t("trk")+lastOrder.id);}
  drawGov();drawShop();drawCart();
  if(!$("#ov").hidden){view($("#v-form").hidden?($("#v-done").hidden?"cart":"done"):"form");}
}

var io;
function reveal(){
  var els=document.querySelectorAll(".rv:not(.in)");
  if(!("IntersectionObserver" in window)){Array.prototype.forEach.call(els,function(e){e.classList.add("in");});return;}
  if(!io){io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.12});}
  Array.prototype.forEach.call(els,function(e){io.observe(e);});
}

(function logo3d(){
  var box=$("#logo3d"),D=44,step=.6,half=D*step/2,front,back;
  function mk(z,ref,extra,face,flip){
    var l=document.createElement("div");l.className="layer"+(face?" face":"");
    l.style.transform="translateZ("+z.toFixed(2)+"px)"+(extra||"");
    l.innerHTML='<svg viewBox="0 0 200 201" aria-hidden="true"><use href="#'+ref+'"/>'+(face?'<use href="#marksh" style="mix-blend-mode:overlay"/>':'')+'</svg>';
    if(flip){l.firstChild.style.transform="scaleX(-1)";}
    box.appendChild(l);return l;
  }
  for(var i=D;i>=1;i--){mk(half-i*step,"marks");}
  back=mk(half-D*step-.4,"markd","rotateY(180deg)",true,true);
  front=mk(half,"markd","",true);
  var rx=-6,ry=-18,vx=0,drag=false,lx=0,ly=0,lm=0,vis=true,t0=performance.now(),idle=0,st=$("#stage");
  var calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function paint(){
    var c=Math.cos(ry*Math.PI/180)*Math.cos(rx*Math.PI/180);
    var f="brightness("+(0.5+0.55*Math.abs(c)).toFixed(3)+")";
    front.style.filter=f;back.style.filter=f;
    box.style.transform="rotateX("+rx.toFixed(2)+"deg) rotateY("+ry.toFixed(2)+"deg)";
  }
  function loop(now){
    if(vis){
      if(!drag){
        if(Math.abs(vx)>.05){ry+=vx;vx*=.95;idle=now+1400;}
        else if(now>idle){
          ry=((ry+180)%360+360)%360-180;
          ry+=(Math.sin((now-t0)/2300)*24-ry)*.07;
          rx+=(-5+Math.cos((now-t0)/3100)*6-rx)*.07;
        }
      }
      paint();
    }
    requestAnimationFrame(loop);
  }
  st.addEventListener("pointerdown",function(e){drag=true;vx=0;lx=e.clientX;ly=e.clientY;lm=performance.now();try{st.setPointerCapture(e.pointerId);}catch(x){}st.style.cursor="grabbing";});
  st.addEventListener("pointermove",function(e){
    if(!drag){return;}
    var dx=e.clientX-lx,dy=e.clientY-ly;
    ry+=dx*.6;vx=Math.max(-25,Math.min(25,dx*.6));rx=Math.max(-30,Math.min(30,rx-dy*.4));
    lx=e.clientX;ly=e.clientY;lm=performance.now();paint();
  });
  function end(){if(!drag){return;}drag=false;if(performance.now()-lm>90){vx=0;}idle=performance.now()+1400;st.style.cursor="grab";}
  st.addEventListener("pointerup",end);st.addEventListener("pointercancel",end);
  if("IntersectionObserver" in window){new IntersectionObserver(function(es){vis=es[0].isIntersecting;}).observe(st);}
  paint();
  if(!calm){requestAnimationFrame(loop);}
})();
})();
</script>
